plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.1'
}

group = 'oopang'
version = '1.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21.0.6'
    modules = [
        'javafx.controls',
        'javafx.fxml'
    ]
}

application {
    mainClass = 'oopang.Launcher'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
        resources {
            srcDirs = ['res']
        }
    }

    test {
        java {
            srcDirs = ['src/test']
        }
    }
}

dependencies {
    implementation files('lib/dyn4j-3.2.4.jar')
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnit()
}

/*
 * jlink configuration
 *
 * Produces a self-contained application:
 *
 * build/image/
 * ├── bin/oop-ang
 * └── lib/
 */
jlink {
    imageZip = file("${buildDir}/distributions/${project.name}-${version}.zip")

    options = [
        '--strip-debug',
        '--compress', '2',
        '--no-header-files',
        '--no-man-pages'
    ]

    launcher {
        name = 'oop-ang'
    }

    jpackage {
        imageName = 'oop-ang'
        installerType = 'app-image'
    }
}

/*
 * Required because jlink needs automatic modules
 * for non-modular dependencies.
 */
tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}